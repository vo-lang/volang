[package]
name = "vo-app-host-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native Window, View, input, IME, and GPU presentation adapters for App Runtime"
repository.workspace = true
homepage.workspace = true
publish = false

[features]
default = []
macos-appkit = [
  "dep:objc2",
  "dep:objc2-app-kit",
  "dep:objc2-foundation",
]
native-wgpu = ["dep:wgpu"]
macos-gpu = ["macos-appkit", "native-wgpu"]
provider-loading = ["dep:libloading"]

[dependencies]
vo-app-protocol = { workspace = true }
vo-app-runtime = { workspace = true, features = ["std"] }
libloading = { version = "0.8", optional = true }
wgpu = { version = "=24.0.5", optional = true, default-features = false, features = ["metal", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", optional = true, default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", optional = true, default-features = false, features = [
  "NSApplication",
  "NSAccessibilityProtocols",
  "NSEvent",
  "NSGraphics",
  "NSResponder",
  "NSTextInputClient",
  "NSTextInputContext",
  "NSView",
  "NSWindow",
  "objc2-core-foundation",
] }
objc2-foundation = { version = "=0.3.2", optional = true, default-features = false, features = [
  "NSArray",
  "NSAttributedString",
  "NSDate",
  "NSGeometry",
  "NSNotification",
  "NSObject",
  "NSRange",
  "NSRunLoop",
  "NSString",
] }
