[package]
name = "vo-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared infrastructure for the Vo compiler: source management, diagnostics, and symbols"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
publish = ["crates-io"]

[dependencies]
vo-common-core = { workspace = true, features = ["std"] }
codespan-reporting = "0.11"
sha2 = "0.10"
zip = { version = "2.2", optional = true, default-features = false, features = ["deflate"] }

[features]
default = ["terminal", "zip"]
terminal = []
zip = ["dep:zip"]
serde = []
