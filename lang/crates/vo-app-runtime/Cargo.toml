[package]
name = "vo-app-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared app session runtime orchestration for Vo hosts"
repository.workspace = true
homepage.workspace = true
publish = false

[features]
default = []
std = ["vo-runtime/std", "vo-vm/std"]
module-plan = ["std", "dep:vo-module"]

[dependencies]
vo-app-protocol = { workspace = true }
vo-runtime = { path = "../vo-runtime", default-features = false }
vo-vm = { path = "../vo-vm", default-features = false }
vo-module = { path = "../vo-module", default-features = false, optional = true }
