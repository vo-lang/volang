[package]
name = "vo-ui-webview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "System WebView adapter for the replacement Volang UI"
publish = false

[features]
default = []
window = ["dep:wry", "dep:tao", "dep:getrandom", "dep:vo-ui-native", "dep:vo-vm", "dep:muda", "dep:url", "dep:windows-sys", "dep:dirs", "dep:objc2-foundation"]
jit = ["window", "vo-ui-native/jit"]
aot = ["window", "vo-ui-native/aot"]

[dependencies]
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
vo-ui-bridge.workspace = true
getrandom = { version = "=0.3.4", optional = true }
wry = { version = "=0.57.0", optional = true }
tao = { version = "=0.37.0", optional = true }
vo-ui-native = { path = "../vo-ui-native", optional = true }
vo-vm = { path = "../vo-vm", optional = true }
url = { version = "=2.5.8", optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
dirs = { version = "=7.0.0", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", optional = true, features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true, optional = true }
objc2-foundation = { version = "=0.3.2", optional = true, features = ["NSProcessInfo"] }

[dev-dependencies]
vo-engine = { path = "../vo-engine", default-features = false }
vo-target.workspace = true

[[example]]
name = "preview"
required-features = ["window"]
