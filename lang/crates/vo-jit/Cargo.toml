[package]
name = "vo-jit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JIT compiler for Vo bytecode using Cranelift"
repository.workspace = true
homepage.workspace = true
publish = false

[features]
default = ["compiler"]
compiler = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native", "dep:cranelift-object", "dep:region", "dep:target-lexicon"]

[dependencies]
vo-runtime = { path = "../vo-runtime" }
vo-common-core = { path = "../vo-common-core" }

# Cranelift JIT
cranelift-codegen = { version = "0.134.3", features = ["all-native-arch"], optional = true }
cranelift-frontend = { version = "0.134.3", optional = true }
cranelift-jit = { version = "0.134.3", optional = true }
cranelift-module = { version = "0.134.3", optional = true }
cranelift-native = { version = "0.134.3", optional = true }
cranelift-object = { version = "0.134.3", optional = true }
region = { version = "3.0", optional = true }
target-lexicon = { version = "=0.13.5", optional = true }

[dev-dependencies]
object = { version = "0.39.1", default-features = false, features = ["read"] }
