[package]
name = "vo-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Vo language runtime - shared data structures for VM and JIT (no_std compatible)"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish = ["crates-io"]

[features]
default = ["std"]
std = ["vo-common-core/std", "linkme", "libloading", "libc"]
gc-debug = ["std"]  # GC 验证模式，需要 std

[dependencies]
libm.workspace = true
vo-common-core.workspace = true
vo-ffi-macro.workspace = true  # Always available (macro generates cfg-gated code)
hashbrown = "0.15"

# Std only
linkme = { version = "0.3", optional = true }
libloading = { version = "0.8", optional = true }
libc = { version = "0.2", optional = true }
