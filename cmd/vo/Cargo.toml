[package]
name = "vo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Vo CLI - Command line interface for the Vo programming language"
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "vo"
path = "src/main.rs"

[features]
default = ["jit"]
jit = ["vo-engine/jit"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
vo-common-core = { path = "../../lang/crates/vo-common-core" }
vo-common = { path = "../../lang/crates/vo-common" }
vo-engine = { path = "../../lang/crates/vo-engine" }
vo-module = { path = "../../lang/crates/vo-module" }
vo-release = { path = "../../lang/crates/vo-release" }
vo-schema-compiler = { path = "../../lang/crates/vo-schema-compiler" }
vo-syntax = { path = "../../lang/crates/vo-syntax" }
