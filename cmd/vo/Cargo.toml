[package]
name = "vo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Vo CLI - Command line interface for the Vo programming language"
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "vo"
path = "src/main.rs"

[features]
default = ["jit", "desktop-ui"]
jit = ["vo-engine/jit"]
desktop-ui = ["dep:vo-ui-shell-native"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
vo-common-core = { path = "../../lang/crates/vo-common-core" }
vo-common = { path = "../../lang/crates/vo-common" }
vo-engine = { path = "../../lang/crates/vo-engine", default-features = false }
vo-module = { path = "../../lang/crates/vo-module" }
vo-release = { path = "../../lang/crates/vo-release" }
vo-schema-compiler = { path = "../../lang/crates/vo-schema-compiler" }
vo-syntax = { path = "../../lang/crates/vo-syntax" }
vo-target.workspace = true
vo-ui-artifact.workspace = true
vo-ui-accessibility.workspace = true
vo-ui-core.workspace = true
vo-ui-layout.workspace = true
vo-ui-paint.workspace = true
vo-ui-plan.workspace = true
vo-ui-protocol.workspace = true
vo-ui-shell-native = { workspace = true, optional = true, features = ["desktop-window"] }
vo-ui-vm.workspace = true
vo-ui-web.workspace = true
vo-vm = { path = "../../lang/crates/vo-vm", default-features = false }

[target.'cfg(windows)'.dependencies]
find-msvc-tools = "=0.1.9"
