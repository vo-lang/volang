[[gate]]
id = "performance-and-resilience"
status = "complete"
acceptance = ["Startup, compressed download, binary size, memory, allocation, frame, latency, jank, power, backpressure, recovery, observability, and security budgets pass."]
commands = ["cargo run --locked --profile release-native -p vo-ui-benchmark", "cargo test --locked -p vo-engine --features jit official_ui_testing_and_observability_are_vm_jit_and_aot_equivalent"]
evidence = ["ui/crates/vo-ui-benchmark/src/main.rs", "ui/docs/quality-budgets.md", "ui/observability/observability.vo", "ui/docs/security.md", ".github/workflows/ci.yml#ui_platform"]

[[gate]]
id = "showcase-dogfood"
status = "complete"
acceptance = ["Every required showcase is complete and ships from the same candidate release artifacts."]
commands = ["cargo test --locked -p vo-engine --features jit official_uikit_", "cargo test --locked -p vo-engine --features jit official_data_application_compiles_and_bounds_vm_jit_materialization", "cargo test --locked -p vo-engine --features jit official_content_site_renders_distinct_useful_routes_and_web_aot", "cargo test --locked -p vo-engine --features jit official_media_and_studio_showcases_use_public_advanced_packs"]
evidence = ["ui/showcases", "ui/product-certification.toml", ".github/workflows/release.yml"]

[[gate]]
id = "ecosystem-release"
status = "complete"
acceptance = ["Docs, module metadata, templates, design assets, source extension, authoring kits, compatibility, maintenance, security, and immutable release evidence are complete."]
commands = ["cargo run -q -p vo-dev --locked -- ui-certify --check", "cargo test --locked -p vo-dev release_", "cargo test --locked -p vo official_ui_source_export_is_provenance_checked_and_never_overwrites"]
evidence = ["ui/docs", "ui/module-profiles.toml", "ui/templates", "ui/kit/icons", "ui/editors/vscode", "ui/product-certification.toml", ".github/workflows/release.yml"]
