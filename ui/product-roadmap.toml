schema_version = 2
product = "Volang UI"
target_version = "1.0"
status = "complete"
baseline_roadmap = "ui/roadmap.toml"
capability_catalog = "ui/capabilities.toml"
delivery_plan = "ui/delivery.toml"
uikit_catalog = "ui/kit/catalog.toml"
product_principle = "A small comfortable public API backed by a complete, modular, evidence-driven Web and desktop application platform."
benchmark_families = [
  "Svelte and modern compiler-driven Web frameworks",
  "Flutter",
  "Qt Quick and Qt Quick Controls",
  "Compose Multiplatform",
  "Material, Fluent, Carbon, Bits UI, shadcn-svelte, and Skeleton",
  "WAI-ARIA Authoring Practices and WCAG 2.2",
]

[completion]
required_capability_maturity = "stable"
required_delivery_increment = "E8"
required_domains = [
  "authoring-model",
  "state-concurrency",
  "layout-scroll",
  "graphics-media",
  "text-editing",
  "input-interaction",
  "accessibility-i18n",
  "design-system-uikit",
  "application-patterns",
  "web-application",
  "desktop-application",
  "platform-services",
  "developer-experience",
  "testing-quality",
  "performance-reliability-security",
  "ecosystem-governance",
]
required_showcases = ["component-gallery", "content-site", "data-application", "media-application", "studio-workbench"]
required_gates = [
  "public-api-usability",
  "component-and-pattern-coverage",
  "layout-graphics-text",
  "input-accessibility-i18n",
  "web-product",
  "desktop-product",
  "platform-and-media-services",
  "developer-tools",
  "testing-matrix",
  "performance-and-resilience",
  "showcase-dogfood",
  "ecosystem-release",
]

[[domain]]
id = "authoring-model"
name = "Component authoring and public API"
benchmarks = ["Svelte", "Flutter", "Compose Multiplatform"]
outcome = "Ordinary typed .vo code composes separately compiled component instances with stable identity, lifecycle, environment, direct updates, and a bounded dynamic fallback."

[[domain]]
id = "state-concurrency"
name = "State, data flow, and goroutine concurrency"
benchmarks = ["Svelte runes", "Compose state and coroutines", "structured concurrency"]
outcome = "Structured state and scoped goroutines publish deterministic typed results through one bounded UI writer."

[[domain]]
id = "layout-scroll"
name = "Layout, scrolling, and adaptation"
benchmarks = ["Flutter layout", "Qt Quick layouts", "CSS layout"]
outcome = "Web and desktop share logical layout, scrolling, adaptation, identity, and accessibility semantics with explicit target variations."

[[domain]]
id = "graphics-media"
name = "Painting, graphics, assets, animation, and media"
benchmarks = ["Flutter rendering", "Qt Quick scene graph", "Web Canvas, SVG, and media"]
outcome = "Typed graphics and media APIs have bounded assets, permissions, lifetime, recovery, and independently linkable implementations."

[[domain]]
id = "text-editing"
name = "Text, rich content, documents, and editing"
benchmarks = ["Flutter text", "Qt Quick TextEdit", "Monaco-class editor behavior"]
outcome = "One Unicode-correct document and editing model spans basic inputs, rich content, Markdown, and the official code editor."

[[domain]]
id = "input-interaction"
name = "Input, focus, gestures, commands, and drag/drop"
benchmarks = ["Qt Quick input handlers", "Flutter gestures", "WAI-ARIA APG"]
outcome = "Every input mode enters deterministic focus, gesture, overlay, command, drag/drop, and cancellation state machines."

[[domain]]
id = "accessibility-i18n"
name = "Accessibility, localization, and inclusive adaptation"
benchmarks = ["WCAG 2.2", "WAI-ARIA APG", "Flutter semantics", "Qt accessibility"]
outcome = "Official behavior is accessible, localizable, bidirectional, adaptable, and verifiable on real assistive technology."

[[domain]]
id = "design-system-uikit"
name = "Official design system and UIKit"
benchmarks = ["Material 3", "Fluent 2", "Carbon", "Bits UI", "shadcn-svelte", "Skeleton"]
outcome = "Headless behavior primitives and distinctly Volang visual recipes provide an immediate-use, deeply extensible official UIKit."

[[domain]]
id = "application-patterns"
name = "Application architecture and reusable patterns"
benchmarks = ["SvelteKit", "Compose Navigation", "Flutter application architecture", "Carbon patterns"]
outcome = "Navigation, forms, commands, asynchronous data, persistence, collections, and product patterns compose through public APIs."

[[domain]]
id = "web-application"
name = "Complete Web application product"
benchmarks = ["SvelteKit", "Next.js", "modern browser platform"]
outcome = "Volang owns client, server, SSG, streaming SSR, activation, actions, caching, metadata, PWA, security, and deployment without an application JavaScript graph."

[[domain]]
id = "desktop-application"
name = "Complete desktop application product"
benchmarks = ["Qt Quick", "Flutter desktop", "Compose Desktop"]
outcome = "Portable Volang applications own real windows, lifecycle, shell integration, packages, signing policy, updates, and rollback on macOS, Windows, and Linux."

[[domain]]
id = "platform-services"
name = "System, storage, networking, plugins, and interoperability"
benchmarks = ["Flutter plugins", "Qt modules", "browser Web APIs"]
outcome = "Typed capability and permission contracts cover system, network, storage, process, media, extension, and generated host bindings."

[[domain]]
id = "developer-experience"
name = "CLI, diagnostics, preview, inspection, and profiling"
benchmarks = ["Flutter DevTools", "Qt QML tooling", "Svelte CLI", "Compose Hot Reload"]
outcome = "One toolchain creates, develops, reloads, tests, inspects, profiles, analyzes, packages, and publishes applications with actionable diagnostics."

[[domain]]
id = "testing-quality"
name = "Testing, conformance, and quality engineering"
benchmarks = ["Flutter testing", "Qt Quick Test", "Playwright-class browser testing"]
outcome = "Contract probes and production hosts share semantic input, deterministic fakes, goldens, fuzzing, real-platform automation, and immutable evidence."

[[domain]]
id = "performance-reliability-security"
name = "Performance, reliability, security, and observability"
benchmarks = ["Flutter performance discipline", "Qt scene graph", "Web Core Vitals"]
outcome = "Representative budgets, bounded work, recovery, observability, least authority, secure decoding, and supply-chain policy fail releases on regressions."

[[domain]]
id = "ecosystem-governance"
name = "Documentation, distribution, design assets, and ecosystem governance"
benchmarks = ["Flutter packages and docs", "Svelte package catalog", "Carbon ecosystem"]
outcome = "The Volang module system distributes governed UI packages with documentation, templates, provenance, compatibility, maintenance, and release policy."

[[showcase]]
id = "component-gallery"
name = "Official UIKit gallery and interaction laboratory"
status = "complete"
starts_in = "E3"
acceptance = ["Every official component, state, theme, locale, density, input mode, and accessibility mode runs as Web AOT and packaged Native AOT."]
commands = ["cargo test --locked -p vo-engine --features jit official_uikit_", "./eng/run-uikit-gallery-contracts.sh", "npm --prefix lang/crates/vo-web run test:uikit-gallery-browser"]
evidence = ["ui/showcases/component-gallery/main.vo", "ui/kit/catalog.toml", "ui/testdata/goldens/uikit.accessibility.txt", "ui/testdata/goldens/uikit.paint.txt", "ui/testdata/goldens/uikit.web.txt", "target/rewrite-validation/volang-uikit-gallery-browser.json"]

[[showcase]]
id = "content-site"
name = "Content, documentation, and forms Web application"
status = "complete"
starts_in = "E5"
acceptance = ["SSG, SSR, streaming, metadata, search, forms, assets, offline policy, activation, and WCAG 2.2 AA ship useful HTML before Wasm."]
commands = ["cargo test --locked -p vo-engine --features jit official_content_site_renders_distinct_useful_routes_and_web_aot", "./eng/run-content-site-contracts.sh", "npm --prefix lang/crates/vo-web run test:content-site-browser"]
evidence = ["ui/showcases/content-site/main.vo", "ui/showcases/content-site/ui.web.toml", "ui/web/server/server.vo", "eng/run-content-site-contracts.sh", "target/rewrite-validation/volang-content-site-browser.json", "ui/docs/web-desktop-products.md"]

[[showcase]]
id = "data-application"
name = "Data-dense dashboard and administration application"
status = "complete"
starts_in = "E4"
acceptance = ["Tables, trees, virtual grids, filtering, sorting, pagination, charts, forms, commands, optimistic data, responsive Web, and desktop workspaces share one domain model."]
commands = ["cargo test --locked -p vo-engine --features jit official_data_application_compiles_and_bounds_vm_jit_materialization", "./eng/run-data-application-contracts.sh", "npm --prefix lang/crates/vo-web run test:data-application-browser", "cargo run --locked --profile release-native -p vo-ui-benchmark"]
evidence = ["ui/showcases/data-application/main.vo", "ui/tests/application-platform/main.vo", "ui/resource/resource.vo", "ui/kit/data/data.vo", "eng/run-data-application-contracts.sh", "target/rewrite-validation/volang-data-application-browser.json", ".github/workflows/ci.yml#ui_platform"]

[[showcase]]
id = "media-application"
name = "Graphics and media application"
status = "complete"
starts_in = "E6"
acceptance = ["Images, SVG, canvas, animation, audio, video, capture, permissions, recovery, and capability results cover Web, macOS, Windows, and Linux."]
commands = ["cargo test --locked -p vo-engine --features jit official_media_and_studio_showcases_use_public_advanced_packs", "cargo test --locked -p vo-engine --features jit official_advanced_packs_are_vm_jit_and_aot_equivalent", "./eng/run-media-application-contracts.sh", "npm --prefix lang/crates/vo-web run test:media-application-browser"]
evidence = ["ui/showcases/media-application/main.vo", "ui/media/media.vo", "lang/crates/vo-web/js/ui_dom.ts", "eng/run-media-application-contracts.sh", "target/rewrite-validation/volang-media-application-browser.json", ".github/workflows/ci.yml#ui_platform", "ui/docs/advanced-capability-packs.md"]

[[showcase]]
id = "studio-workbench"
name = "Pure-Volang Studio workbench"
status = "complete"
starts_in = "E6"
acceptance = ["Project management, file tree, official editor, console, docs, commands, windows, and embedded previews use public APIs across VM/JIT development and Wasm/Native AOT release."]
commands = ["cargo test --locked -p vo-engine --features jit official_media_and_studio_showcases_use_public_advanced_packs", "cargo test --locked -p vo-engine --features jit official_multi_window_editor_preserves_shared_document_and_native_aot", "./eng/run-studio-workbench-contracts.sh", "npm --prefix lang/crates/vo-web run test:studio-workbench-browser", "cargo test --locked -p vo pure_volang_studio_starter_opens_edits_saves_and_runs", "npm --prefix lang/crates/vo-web run test:studio-aot-browser"]
evidence = ["ui/showcases/studio-workbench/main.vo", "ui/showcases/studio-workbench/ui.web.toml", "ui/showcases/studio-workbench/ui.desktop.toml", "ui/templates/studio/main.vo", "ui/editor/editor.vo", "ui/workspace/workspace.vo", "ui/tests/multi-window-editor/main.vo", "apps/studio/app/app.vo", "apps/studio/examples/examples.vo", "apps/studio/product-parity.toml", "eng/run-studio-workbench-contracts.sh", "target/rewrite-validation/volang-studio-workbench-browser.json", ".github/workflows/ci.yml#ui_platform"]

[[gate]]
id = "public-api-usability"
status = "complete"
acceptance = ["Executable authoring probes pass API ceremony, diagnostics, documentation, migration, target, and stability review."]
commands = ["cargo test --locked -p vo ui_", "cargo test --locked -p vo-engine --features jit official_ui_"]
evidence = ["ui/templates", "ui/docs/getting-started.md", "ui/docs/authoring-guide.md", "ui/docs/compatibility-migration.md", "cmd/vo/src/ui_dev.rs"]

[[gate]]
id = "component-and-pattern-coverage"
status = "complete"
acceptance = ["The governed UIKit, behavior, command, form, data, navigation, and application-pattern matrices contain no required incomplete row."]
commands = ["cargo test --locked -p vo-engine --features jit official_uikit_", "cargo run -q -p vo-dev --locked -- ui-certify --check"]
evidence = ["ui/kit/catalog.toml", "ui/kit/components/components.vo", "ui/kit/data/data.vo", "ui/tests/application-platform/main.vo", "ui/showcases/component-gallery/main.vo"]

[[gate]]
id = "layout-graphics-text"
status = "complete"
acceptance = ["Layout, scrolling, graphics, assets, animation, rich text, documents, editing, charting, and media pass declared cross-renderer conformance."]
commands = ["cargo test --locked -p vo-ui-layout -p vo-ui-paint -p vo-ui-golden", "cargo test --locked -p vo-engine --features jit official_advanced_packs_are_vm_jit_and_aot_equivalent"]
evidence = ["ui/crates/vo-ui-layout", "ui/crates/vo-ui-paint", "ui/graphics/graphics.vo", "ui/document/document.vo", "ui/editor/editor.vo", "ui/media/media.vo"]

[[gate]]
id = "input-accessibility-i18n"
status = "complete"
acceptance = ["Input, focus, gestures, APG interaction, WCAG 2.2 AA, assistive technology, IME, RTL, and locale matrices pass."]
commands = ["cargo test --locked -p vo-ui-accessibility -p vo-ui-accesskit -p vo-ui-golden", "npm --prefix lang/crates/vo-web run test:ui"]
evidence = ["ui/testdata/goldens/uikit.accessibility.txt", "ui/gesture/gesture.vo", "ui/i18n", "ui/docs/accessibility-localization.md", ".github/workflows/ci.yml"]

[[gate]]
id = "web-product"
status = "complete"
acceptance = ["Client, server authority, SSG, streaming SSR, activation, actions, caching, metadata, PWA, security, and deployment adapters pass real-browser suites."]
commands = ["npm --prefix lang/crates/vo-web run test:ui", "npm --prefix lang/crates/vo-web run test:ui-browser", "npm --prefix lang/crates/vo-web run test:ui-component-browser", "npm --prefix lang/crates/vo-web run test:content-site-browser", "./eng/run-content-site-contracts.sh", "cargo test --locked -p vo-engine --features jit official_content_site_renders_distinct_useful_routes_and_web_aot"]
evidence = ["lang/crates/vo-web", "ui/web", "ui/showcases/content-site", "ui/docs/web-desktop-products.md", ".github/workflows/ci.yml#wasm_web"]

[[gate]]
id = "desktop-product"
status = "complete"
acceptance = ["macOS, Windows, and Linux window, lifecycle, service, accessibility, package, signing-policy, update, and rollback suites pass."]
commands = ["cargo test --locked -p vo-ui-shell-native --features desktop-window", "cargo test --locked -p vo-ui-host-native -p vo-ui-system-native -p vo-ui-accesskit -p vo-ui-present-wgpu", "cargo test --locked -p vo-dev release_"]
evidence = ["lang/crates/vo-ui-shell-native", "lang/crates/vo-ui-host-native", "ui/docs/platform-capabilities.md", "ui/docs/web-desktop-products.md", ".github/workflows/ci.yml#ui_platform"]

[[gate]]
id = "platform-and-media-services"
status = "complete"
acceptance = ["Capability, permission, system, storage, network, process, plugin, graphics, media, and capture contracts pass support and failure matrices."]
commands = ["cargo test --locked -p vo-engine --features jit official_advanced_packs_are_vm_jit_and_aot_equivalent", "cargo test --locked -p vo-ui-system -p vo-ui-system-native -p vo-ui-protocol"]
evidence = ["ui/platform/platform.vo", "ui/system/system.vo", "ui/media/media.vo", "ui/testing/testing.vo", "ui/tests/advanced-packs/main.vo"]

[[gate]]
id = "developer-tools"
status = "complete"
acceptance = ["CLI, language tooling, diagnostics, reload, preview, inspector, profiler, size analyzer, package, and publish workflows pass."]
commands = ["cargo test --locked -p vo ui_", "cargo test --locked -p vo-engine --features jit official_ui_testing_and_observability_are_vm_jit_and_aot_equivalent", "cargo run -q -p vo-dev --locked -- ui-certify --check"]
evidence = ["cmd/vo/src/ui_dev.rs", "ui/language/language.vo", "ui/editor/editor.vo", "ui/editors/vscode", "ui/docs/tooling-resilience-ecosystem.md"]

[[gate]]
id = "testing-matrix"
status = "complete"
acceptance = ["Contract through packaged E2E, golden, fuzz, failure injection, browser, native OS, server, and assistive-technology suites pass."]
commands = ["cargo test --workspace --all-targets --locked", "npm --prefix lang/crates/vo-web run test:ui", "cargo test --locked -p vo-dev release_"]
