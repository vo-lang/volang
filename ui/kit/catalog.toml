schema_version = 2
product = "Volang UI"
delivery = "E3"
status = "complete"

families = ["content", "form", "feedback", "overlay", "navigation", "data"]
targets = ["headless", "web-vm", "web-wasm-aot", "desktop-vm", "desktop-jit", "desktop-native-aot"]
themes = ["light", "dark", "high-contrast"]
densities = ["compact", "comfortable", "spacious"]
directions = ["ltr", "rtl"]
parity_gap = []

[market_baseline]
status = "complete"
benchmarks = ["Material 3", "Fluent 2", "Carbon", "shadcn-svelte", "WAI-ARIA APG"]
components = [
  "application", "typography", "surface", "card", "avatar", "avatar-group", "badge", "tag", "keyboard-key", "separator",
  "button", "icon-button", "button-group", "loading-button", "text-field", "text-area", "search-box", "number-input", "checkbox", "switch",
  "radio-group", "slider", "select", "segmented-control", "form", "input-group", "combobox", "multi-select", "date-picker", "calendar",
  "file-uploader", "toggle-group", "alert", "progress", "step-indicator", "spinner", "inline-loading", "skeleton", "empty-state", "toast-region",
  "dialog", "alert-dialog", "command-palette", "popover", "tooltip", "drawer", "menu", "context-menu", "tabs", "accordion",
  "breadcrumb", "pagination", "navigation-rail", "navigation-menu", "data-table", "tree", "list", "bar-chart", "carousel", "scroll-area",
  "resizable", "rating", "code-snippet",
]
quality_dimensions = [
  "public API", "visual states", "keyboard interaction", "accessibility semantics", "responsive adaptation", "RTL",
  "theme and density", "VM/JIT/AOT equivalence", "real browser", "real desktop", "documentation", "failure recovery",
]

