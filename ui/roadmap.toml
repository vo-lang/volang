[[performance_budget]]
id = "direct-slot-update"
metric = "work"
target = "O(changed update sites)"
enforced_from = "M2"

[[performance_budget]]
id = "steady-state-update-allocation"
metric = "host allocations per scalar slot update"
target = "0"
enforced_from = "M7"

[[performance_budget]]
id = "frame-commit"
metric = "p95 UI work at 60 Hz on reference hardware"
target = "<= 8 ms"
enforced_from = "M7"

[[performance_budget]]
id = "interaction-latency"
metric = "p95 input-to-present on reference hardware"
target = "<= 50 ms"
enforced_from = "M7"
