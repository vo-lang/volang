schema_version = 1
product = "Volang UI"
scope = "foundation-and-end-to-end-baseline"
completion_claim = "foundation-certified"
frozen = true
product_status = "in-progress"
product_roadmap = "ui/product-roadmap.toml"
capability_catalog = "ui/capabilities.toml"
delivery_plan = "ui/delivery.toml"
source_extension = ".vo"
language_dependency_direction = "lang-adapter -> ui-plan"
development_backends = ["vm", "jit"]
release_backends = ["native-aot", "wasm-aot"]
platforms = ["web", "desktop"]

[completion]
required_milestones = ["M0", "M1", "M2", "M3", "M4", "M5", "M6", "M7"]
required_gates = [
  "workspace-test",
  "workspace-clippy",
  "no-std-check",
  "renderer-conformance",
  "vm-jit-aot-differential",
  "web-browser-suite",
  "desktop-platform-suite",
  "accessibility-suite",
  "performance-budget",
  "examples-and-templates",
  "release-certification",
]

