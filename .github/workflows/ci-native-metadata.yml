name: Native metadata diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup pinned Cargo
        uses: ./.github/actions/setup-volang
      - name: Compare bounded metadata observations
        shell: bash
        run: python eng/probe-native-metadata.py
      - name: Preserve differing metadata fields
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-metadata-${{ matrix.os }}-${{ github.sha }}
          path: target/ci/native-metadata-probe
          if-no-files-found: error
          retention-days: 14
