name: Release

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful full CI run for this exact candidate commit
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  VOWORK: "off"

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.ref || 'production' }}
  queue: max
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      build_date: ${{ steps.release.outputs.build_date }}
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
      ci_run_id: ${{ steps.trust.outputs.ci_run_id || steps.candidate_trust.outputs.ci_run_id }}
      purpose: ${{ steps.release.outputs.purpose }}
      artifact_directory: ${{ steps.release.outputs.artifact_directory }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup release toolchain
        uses: ./.github/actions/setup-volang

      - name: Trust release commit
        if: github.event_name == 'repository_dispatch'
        id: trust
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
        run: |
          if [ "$GITHUB_REPOSITORY" != "vo-lang/volang" ]; then
            echo "release workflow must run in vo-lang/volang" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "release workflow must be dispatched from main" >&2
            exit 1
          fi
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "release tag must start with v" >&2; exit 1 ;;
          esac

          head_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "release tag and checked-out source must match" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main || {
            echo "release tag must point to a commit reachable from origin/main" >&2
            exit 1
          }

          ci_run_id="$(gh api --hostname github.com --method GET \
            "repos/vo-lang/volang/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f head_sha="$tag_commit" \
            -f status=success \
            -f per_page=1 \
            --jq '.workflow_runs[0].id // empty')"
          if [ -z "$ci_run_id" ]; then
              echo "tagged commit has no successful main CI run" >&2
              exit 1
          fi
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"

          environment="$(gh api --hostname github.com --method GET \
            "repos/vo-lang/volang/environments/release")"
          jq --exit-status '
            .can_admins_bypass == false and
            .deployment_branch_policy.protected_branches == false and
            .deployment_branch_policy.custom_branch_policies == true and
            any(.protection_rules[]?;
                .type == "required_reviewers" and
                .prevent_self_review == true and
                ((.reviewers // []) | length) > 0)
          ' <<<"$environment" >/dev/null || {
            echo "release environment must require independent reviewers, block administrator bypass, and use an explicit branch policy" >&2
            exit 1
          }
          branch_policies="$(gh api --hostname github.com --method GET \
            "repos/vo-lang/volang/environments/release/deployment-branch-policies")"
          jq --exit-status '
            .total_count == 1 and
            (.branch_policies | length) == 1 and
            .branch_policies[0].name == "main" and
            .branch_policies[0].type == "branch"
          ' <<<"$branch_policies" >/dev/null || {
            echo "release environment must allow only the main branch" >&2
            exit 1
          }

      - name: Bind candidate to successful full CI
        if: github.event_name == 'workflow_dispatch'
        id: candidate_trust
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          test "$GITHUB_REPOSITORY" = vo-lang/volang
          [[ "$GITHUB_REF" == refs/heads/* ]]
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]{0,15}$ ]]
          head_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          test "$head_commit" = "$GITHUB_SHA"
          gh api "repos/vo-lang/volang/actions/runs/$CI_RUN_ID" \
            | jq --exit-status --arg sha "$head_commit" --arg branch "$GITHUB_REF_NAME" '
                .repository.full_name == "vo-lang/volang" and
                .head_repository.full_name == "vo-lang/volang" and
                .path == ".github/workflows/ci.yml" and
                .head_sha == $sha and .head_branch == $branch and
                .event == "workflow_dispatch" and .run_attempt == 1 and
                .status == "completed" and .conclusion == "success"
              ' >/dev/null
          echo "commit=$head_commit" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$CI_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Build release tool
        run: cargo build --locked -p vo-dev

      - name: Download certified source evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-certification-${{ steps.trust.outputs.commit || steps.candidate_trust.outputs.commit }}
          path: target/ci/release-input
          repository: ${{ github.repository }}
          run-id: ${{ steps.trust.outputs.ci_run_id || steps.candidate_trust.outputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Verify identity and plan targets
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
        run: |
          ./target/debug/vo-dev lint release
          ./target/debug/vo-dev ui-certify --check
          release_args=(release)
          profile=main
          purpose=release
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            release_args+=(candidate)
            profile=merge
            purpose=candidate
          fi
          ./target/debug/vo-dev ci verify \
            --bundle target/ci/release-input/certification.json --profile "$profile"
          ./target/debug/vo-dev ui-certify \
            --evidence target/ci/release-input/certification.json
          if [ "$purpose" = release ]; then
            unset GITHUB_REF_NAME GITHUB_SHA
            metadata="$(./target/debug/vo-dev release metadata --tag "$RELEASE_TAG" \
              --commit "$(git rev-parse --verify 'HEAD^{commit}')")"
          else
            unset VO_RELEASE_TAG
            metadata="$(./target/debug/vo-dev release candidate metadata)"
          fi
          matrix="$(./target/debug/vo-dev "${release_args[@]}" matrix | jq -ce .)"
          {
            printf 'matrix=%s\n' "$matrix"
            printf 'purpose=%s\n' "$purpose"
            printf 'tag=%s\n' "$(jq -r '.tag // ""' <<<"$metadata")"
            printf 'artifact_directory=%s\n' "$(jq -r '.artifact_directory // "."' <<<"$metadata")"
            printf 'commit=%s\n' "$(jq -er .commit <<<"$metadata")"
            printf 'build_date=%s\n' "$(jq -er .build_date <<<"$metadata")"
            printf 'source_date_epoch=%s\n' "$(jq -er .source_date_epoch <<<"$metadata")"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release certification input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-certification-${{ steps.release.outputs.commit }}
          path: target/ci/release-input/certification.json
          if-no-files-found: error
          retention-days: 30

  web_runtime:
    name: Build shared Web runtime
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false

      - name: Setup Rust and WebAssembly
        uses: ./.github/actions/setup-volang
        with:
          wasm: "true"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: lang/crates/vo-web/package-lock.json

      - name: Cache wasm-pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-0.14.0

      - name: Install wasm-pack
        run: |
          if [ "$(wasm-pack --version 2>/dev/null || true)" != "wasm-pack 0.14.0" ]; then
            cargo install wasm-pack --locked --version 0.14.0 --force
          fi

      - name: Build release tooling and Web runtime
        run: |
          cargo build --locked -p vo-dev
          ./target/debug/vo-dev release build-web-runtime

      - name: Upload platform-neutral Web runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-web-runtime-${{ needs.preflight.outputs.commit }}
          path: |
            lang/crates/vo-web/dist
            lang/crates/vo-web/pkg
            lang/crates/vo-web/aot-support
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  build:
    name: Build ${{ matrix.target }}
    needs: [preflight, web_runtime]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup release toolchain
        uses: ./.github/actions/setup-volang

      - name: Install Linux window smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxkbcommon-x11-0 mesa-vulkan-drivers xvfb

      - name: Download shared Web runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-web-runtime-${{ needs.preflight.outputs.commit }}
          path: lang/crates/vo-web

      - name: Download release certification input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-certification-${{ needs.preflight.outputs.commit }}
          path: target/ci/release-input

      - name: Build release tool
        run: cargo build --locked -p vo-dev

      - name: Build and package CLI
        shell: bash
        env:
          RELEASE_PURPOSE: ${{ needs.preflight.outputs.purpose }}
          VO_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          VO_BUILD_COMMIT: ${{ needs.preflight.outputs.commit }}
          VO_BUILD_DATE: ${{ needs.preflight.outputs.build_date }}
          SOURCE_DATE_EPOCH: ${{ needs.preflight.outputs.source_date_epoch }}
          VO_CI_CERTIFICATION_PATH: target/ci/release-input/certification.json
        run: |
          release_args=(release)
          if [ "$RELEASE_PURPOSE" = candidate ]; then
            unset VO_RELEASE_TAG
            release_args+=(candidate)
          else
            unset GITHUB_REF_NAME GITHUB_SHA
          fi
          ./target/debug/vo-dev "${release_args[@]}" build "${{ matrix.target }}"
          case "${{ matrix.target }}" in
            *windows*)
              binary="./target/${{ matrix.target }}/release/vo.exe"
              runtime="./target/${{ matrix.target }}/release/vo_aot_runtime.lib"
              hello="./target/${{ matrix.target }}/release/hello-aot-smoke.exe"
              ;;
            *)
              binary="./target/${{ matrix.target }}/release/vo"
              runtime="./target/${{ matrix.target }}/release/libvo_aot_runtime.a"
              hello="./target/${{ matrix.target }}/release/hello-aot-smoke"
              ;;
          esac
          "$binary" --version
          "$binary" run tests/lang/cases/runtime/array_len_cap_runtime.vo --mode=vm
          "$binary" run tests/lang/cases/runtime/array_len_cap_runtime.vo --mode=jit
          "$binary" build examples/basics/hello.vo \
            --runtime="$runtime" \
            --no-cache \
            -o "$hello"
          test "$("$hello")" = "Hello, hello!"
          ./target/debug/vo-dev "${release_args[@]}" package "${{ matrix.target }}"
          unpack="./target/${{ matrix.target }}/release/package-smoke"
          mkdir -p "$unpack"
          tar -xzf "${{ needs.preflight.outputs.artifact_directory }}/${{ matrix.artifact_name }}" -C "$unpack"
          case "${{ matrix.target }}" in
            *windows*)
              packaged_vo="$unpack/vo.exe"
              packaged_ui_runtime="$unpack/vo_ui_aot_runtime_native.lib"
              ui_native="./target/${{ matrix.target }}/release/ui-native-aot-smoke.exe"
              ;;
            *)
              packaged_vo="$unpack/vo"
              packaged_ui_runtime="$unpack/libvo_ui_aot_runtime_native.a"
              ui_native="./target/${{ matrix.target }}/release/ui-native-aot-smoke"
              ;;
          esac
          "$packaged_vo" ui build ui/examples/settings \
            -o "./target/${{ matrix.target }}/release/ui-web-smoke"
          test -f "./target/${{ matrix.target }}/release/ui-web-smoke/app.wasm"
          test -f "./target/${{ matrix.target }}/release/ui-web-smoke/runtime/dist/index.js"
          test -f "./target/${{ matrix.target }}/release/ui-web-smoke/runtime/aot-support/vo_aot_support_wasm_bg.wasm"
          starter="$RUNNER_TEMP/vo-ui-release-starter"
          export VO_MOD_CACHE="$RUNNER_TEMP/vo-ui-module-cache"
          "$packaged_vo" ui new "$starter"
          test -f "$starter/vo.lock"
          "$packaged_vo" ui test "$starter" --mode=vm
          "$packaged_vo" build ui/examples/settings \
            --runtime="$packaged_ui_runtime" \
            --no-cache \
            -o "$ui_native"
          test -f "$ui_native"
          ./target/debug/vo-dev release probe-native-ui "${{ matrix.target }}"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.preflight.outputs.purpose }}-package-${{ matrix.target }}
          path: |
            ${{ needs.preflight.outputs.artifact_directory }}/${{ matrix.artifact_name }}
            ${{ needs.preflight.outputs.artifact_directory }}/${{ matrix.artifact_name }}.sha256
            ${{ needs.preflight.outputs.artifact_directory }}/${{ matrix.artifact_name }}.provenance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Preserve release build and probe diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-diagnostics-${{ matrix.target }}
          path: |
            target/cargo-timings
            target/ci/release-probes
            target/${{ matrix.target }}/release/vo.release-build.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    if: github.event_name == 'repository_dispatch'
    name: Publish GitHub Release
    needs: [preflight, web_runtime, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      attestations: write
      id-token: write
    environment:
      name: release
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup release toolchain
        uses: ./.github/actions/setup-volang

      - name: Build release tool
        run: cargo build --locked -p vo-dev

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-package-*
          path: artifacts
          merge-multiple: true

      - name: Download release certification input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-certification-${{ needs.preflight.outputs.commit }}
          path: target/ci/release-input

      - name: Verify release packages
        shell: bash
        env:
          VO_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          VO_BUILD_COMMIT: ${{ needs.preflight.outputs.commit }}
          VO_BUILD_DATE: ${{ needs.preflight.outputs.build_date }}
          SOURCE_DATE_EPOCH: ${{ needs.preflight.outputs.source_date_epoch }}
          VO_CI_CERTIFICATION_PATH: target/ci/release-input/certification.json
        run: |
          unset GITHUB_REF_NAME GITHUB_SHA
          ./target/debug/vo-dev ci verify \
            --bundle target/ci/release-input/certification.json \
            --profile main
          ./target/debug/vo-dev ui-certify \
            --evidence target/ci/release-input/certification.json
          ./target/debug/vo-dev release verify \
            --tag "$VO_RELEASE_TAG" \
            --artifacts artifacts

      - name: Generate release notes
        shell: bash
        env:
          VO_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          VO_BUILD_COMMIT: ${{ needs.preflight.outputs.commit }}
          VO_BUILD_DATE: ${{ needs.preflight.outputs.build_date }}
          SOURCE_DATE_EPOCH: ${{ needs.preflight.outputs.source_date_epoch }}
        run: |
          unset GITHUB_REF_NAME GITHUB_SHA
          ./target/debug/vo-dev release notes \
            --tag "$VO_RELEASE_TAG" \
            --out RELEASE_NOTES.md

      - name: Attest release archives
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: artifacts/vo-*.tar.gz

      - name: Revalidate release authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
          RELEASE_SETTINGS_TOKEN: ${{ secrets.RELEASE_SETTINGS_TOKEN }}
        run: |
          head_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$head_commit" != "$RELEASE_COMMIT" ] || [ "$tag_commit" != "$RELEASE_COMMIT" ]; then
            echo "release source changed after preflight" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$RELEASE_COMMIT" refs/remotes/origin/main || {
            echo "release commit is no longer reachable from origin/main" >&2
            exit 1
          }
          gh api --hostname github.com --method GET \
            "repos/vo-lang/volang/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f head_sha="$RELEASE_COMMIT" \
            -f status=success \
            -f per_page=1 \
            | jq --exit-status '.total_count > 0' >/dev/null || {
              echo "release commit no longer has a successful main CI run" >&2
              exit 1
            }

          environment="$(gh api --hostname github.com --method GET \
            "repos/vo-lang/volang/environments/release")"
          jq --exit-status '
            .can_admins_bypass == false and
            .deployment_branch_policy.protected_branches == false and
            .deployment_branch_policy.custom_branch_policies == true and
            any(.protection_rules[]?;
                .type == "required_reviewers" and
                .prevent_self_review == true and
                ((.reviewers // []) | length) > 0)
          ' <<<"$environment" >/dev/null || {
            echo "release environment policy changed after preflight" >&2
            exit 1
          }
          branch_policies="$(gh api --hostname github.com --method GET \
            "repos/vo-lang/volang/environments/release/deployment-branch-policies")"
          jq --exit-status '
            .total_count == 1 and
            (.branch_policies | length) == 1 and
            .branch_policies[0].name == "main" and
            .branch_policies[0].type == "branch"
          ' <<<"$branch_policies" >/dev/null || {
            echo "release environment branch policy changed after preflight" >&2
            exit 1
          }
          if [ -z "$RELEASE_SETTINGS_TOKEN" ]; then
            echo "release environment must provide RELEASE_SETTINGS_TOKEN with repository Administration read access" >&2
            exit 1
          fi
          immutable="$(GH_TOKEN="$RELEASE_SETTINGS_TOKEN" gh api --hostname github.com --method GET \
            "repos/vo-lang/volang/immutable-releases")"
          jq --exit-status '.enabled == true' <<<"$immutable" >/dev/null || {
            echo "immutable releases must be enabled before publication" >&2
            exit 1
          }

      - name: Publish verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VO_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          VO_BUILD_COMMIT: ${{ needs.preflight.outputs.commit }}
          VO_BUILD_DATE: ${{ needs.preflight.outputs.build_date }}
          SOURCE_DATE_EPOCH: ${{ needs.preflight.outputs.source_date_epoch }}
          VO_RELEASE_SETTINGS_TOKEN: ${{ secrets.RELEASE_SETTINGS_TOKEN }}
        run: |
          unset GITHUB_REF_NAME GITHUB_SHA
          ./target/debug/vo-dev release publish \
            --tag "$VO_RELEASE_TAG" \
            --artifacts artifacts \
            --notes RELEASE_NOTES.md

      - name: Verify published release attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: gh release verify "$RELEASE_TAG" --repo github.com/vo-lang/volang

  candidate_verify:
    name: Verify candidate archives and attestations
    if: github.event_name == 'workflow_dispatch'
    needs: [preflight, web_runtime, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup release toolchain
        uses: ./.github/actions/setup-volang
      - name: Build release tool
        run: cargo build --locked -p vo-dev
      - name: Download candidate packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-package-*
          path: target/ci/candidate-download
          merge-multiple: true
      - name: Download release certification input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-certification-${{ needs.preflight.outputs.commit }}
          path: target/ci/release-input
      - name: Verify complete candidate asset set
        env:
          VO_CI_CERTIFICATION_PATH: target/ci/release-input/certification.json
        run: |
          ./target/debug/vo-dev ci verify --bundle "$VO_CI_CERTIFICATION_PATH" --profile merge
          ./target/debug/vo-dev ui-certify --evidence "$VO_CI_CERTIFICATION_PATH"
          ./target/debug/vo-dev release candidate verify --artifacts target/ci/candidate-download
      - name: Attest candidate archives
        id: attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: target/ci/candidate-download/vo-candidate-*.tar.gz
      - name: Verify signed source and workflow identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        run: |
          mkdir -p target/ci/candidate-verification
          cp "$ATTESTATION_BUNDLE" target/ci/candidate-verification/attestation.jsonl
          for archive in target/ci/candidate-download/vo-candidate-*.tar.gz; do
            gh attestation verify "$archive" \
              --bundle "$ATTESTATION_BUNDLE" --repo vo-lang/volang \
              --signer-workflow vo-lang/volang/.github/workflows/release.yml \
              --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners --format json \
              > "target/ci/candidate-verification/$(basename "$archive").attestation.json"
          done
          printf 'Candidate %s: all five archives, native probes, source-bound certification and signed attestations passed.\n' \
            "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve candidate verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-verification-${{ github.sha }}
          path: target/ci/candidate-verification
          if-no-files-found: warn
          retention-days: 30
