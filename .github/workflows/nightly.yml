name: Nightly

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  VOWORK: "off"

jobs:
  language_release_native:
    name: language-release-native
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build repository tooling
        run: cargo build -p vo-dev --locked

      - name: Run complete native release matrix
        run: ./target/debug/vo-dev test run --suite lang --targets vm,jit,osr,gc-vm,gc-jit,gc-osr,nostd,compile --release

  language_release_wasm:
    name: language-release-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust and WebAssembly target
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.94.0
          rustup default 1.94.0

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Cache wasm-pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-0.14.0

      - name: Install wasm-pack
        run: |
          if [ "$(wasm-pack --version 2>/dev/null || true)" != "wasm-pack 0.14.0" ]; then
            cargo install wasm-pack --locked --version 0.14.0 --force
          fi

      - name: Build repository tooling
        run: cargo build -p vo-dev --locked

      - name: Run complete WebAssembly release matrix
        run: ./target/debug/vo-dev test run --suite lang --targets wasm --release

  stress:
    name: stress-${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gc
            targets: gc-vm,gc-jit
            tags: gc
            repeat: 20
          - name: jit-osr
            targets: jit,osr
            tags: jit
            repeat: 5
          - name: gc-osr
            targets: vm,gc-vm,gc-osr
            tags: jit,osr,contract
            repeat: 5
          - name: scheduler
            targets: vm,jit
            tags: scheduler
            repeat: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build repository tooling
        run: cargo build -p vo-dev --locked

      - name: Run stress selection
        run: ./target/debug/vo-dev test run --suite lang --targets "${{ matrix.targets }}" --tags "${{ matrix.tags }}" --repeat "${{ matrix.repeat }}" --release

  platform:
    name: platform-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build repository tooling
        run: cargo build -p vo-dev --locked

      - name: Run native language smoke matrix
        run: ./target/debug/vo-dev test run --suite lang --tags smoke --targets native,gc-vm,gc-osr --release

      - name: Run workspace tests
        run: cargo test --workspace --all-targets --locked

  bounded_fuzz:
    name: bounded-fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_FUZZ_VERSION: "0.13.2"
      RUST_NIGHTLY: "nightly-2026-08-20"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ui_artifact_decoders
            fuzz_dir: fuzz/ui-artifact
            max_len: 65536
          - target: decoders
            fuzz_dir: fuzz/app-protocol
            max_len: 4096
          - target: voplay_decoders
            fuzz_dir: fuzz/voplay-protocol
            max_len: 4096
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install fuzzing toolchain
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal

      - name: Cache Cargo downloads and cargo-fuzz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.tool_cache }}/cargo-fuzz
          key: cargo-${{ runner.os }}-${{ runner.arch }}-fuzz-${{ env.CARGO_FUZZ_VERSION }}-${{ hashFiles('fuzz/**/Cargo.lock') }}

      - name: Install cargo-fuzz
        run: |
          echo "$RUNNER_TOOL_CACHE/cargo-fuzz/bin" >> "$GITHUB_PATH"
          if [[ ! -x "$RUNNER_TOOL_CACHE/cargo-fuzz/bin/cargo-fuzz" ]]; then
            cargo +"$RUST_NIGHTLY" install \
              --root "$RUNNER_TOOL_CACHE/cargo-fuzz" \
              --version "$CARGO_FUZZ_VERSION" \
              cargo-fuzz \
              --locked
          fi

      - name: Build coverage-instrumented fuzz target
        working-directory: ${{ matrix.fuzz_dir }}
        run: |
          cargo +"$RUST_NIGHTLY" fuzz build --fuzz-dir . "${{ matrix.target }}"

      - name: Fuzz authenticated and untrusted protocol boundary
        working-directory: ${{ matrix.fuzz_dir }}
        run: |
          cargo +"$RUST_NIGHTLY" fuzz run --fuzz-dir . "${{ matrix.target }}" -- \
            -runs=100000 \
            -max_len=${{ matrix.max_len }} \
            -timeout=10 \
            -seed=424242

      - name: Preserve fuzzing failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-${{ matrix.target }}-${{ github.sha }}
          path: ${{ matrix.fuzz_dir }}/artifacts
          if-no-files-found: ignore
          retention-days: 14

  audits:
    name: audits
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Cache cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2

      - name: Install cargo-audit
        run: |
          if [ "$(cargo audit --version 2>/dev/null || true)" != "cargo-audit 0.22.2" ]; then
            cargo install cargo-audit --locked --version 0.22.2 --force
          fi

      - name: Audit Rust lockfiles
        run: cargo audit --file Cargo.lock

      - name: Audit vo-web dependencies
        working-directory: lang/crates/vo-web
        run: npm audit --audit-level high
