name: Nightly

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: nightly-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  VOWORK: "off"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup engineering toolchain
        uses: ./.github/actions/setup-volang

      - name: Build CI planner
        run: cargo build --locked -p vo-dev

      - name: Build immutable Nightly plan
        run: >-
          ./target/debug/vo-dev ci plan
          --profile nightly
          --output target/ci/plan.json

      - name: Upload immutable Nightly plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-plan-${{ github.sha }}
          path: target/ci/plan.json
          if-no-files-found: error
          retention-days: 14

  language_release_native:
    name: language-release-native
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Start evidence clock
        shell: bash
        run: echo "VO_CI_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup engineering toolchain
        uses: ./.github/actions/setup-volang

      - name: Download immutable Nightly plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-plan-${{ github.sha }}
          path: target/ci/plan-input

      - name: Build repository tooling
        run: cargo build --locked -p vo-dev

      - name: Run complete native release matrix
        run: |
          mkdir -p target/ci/results
          ./target/debug/vo-dev test run \
            --suite lang \
            --targets vm,jit,osr,gc-vm,gc-jit,gc-osr,nostd,compile \
            --release \
            --format json > target/ci/results/nightly-language-native.json

      - name: Record Nightly evidence
        run: >-
          ./target/debug/vo-dev ci record
          --plan target/ci/plan-input/plan.json
          --task nightly-language-native
          --output target/ci/evidence/nightly-language-native.evidence.json

      - name: Upload Nightly evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-evidence-language-native-${{ github.sha }}
          path: target/ci/evidence/*.evidence.json
          if-no-files-found: error
          retention-days: 14

  language_release_wasm:
    name: language-release-wasm
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Start evidence clock
        shell: bash
        run: echo "VO_CI_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup engineering toolchain
        uses: ./.github/actions/setup-volang
        with:
          wasm: "true"

      - name: Download immutable Nightly plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-plan-${{ github.sha }}
          path: target/ci/plan-input

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Cache wasm-pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-0.14.0

      - name: Install wasm-pack
        run: |
          if [ "$(wasm-pack --version 2>/dev/null || true)" != "wasm-pack 0.14.0" ]; then
            cargo install wasm-pack --locked --version 0.14.0 --force
          fi

      - name: Build repository tooling
        run: cargo build --locked -p vo-dev

      - name: Run complete WebAssembly release matrix
        run: |
          mkdir -p target/ci/results
          ./target/debug/vo-dev test run \
            --suite lang \
            --targets wasm,wasm-aot \
            --release \
            --format json > target/ci/results/nightly-language-wasm.json

      - name: Record Nightly evidence
        run: >-
          ./target/debug/vo-dev ci record
          --plan target/ci/plan-input/plan.json
          --task nightly-language-wasm
          --output target/ci/evidence/nightly-language-wasm.evidence.json

      - name: Upload Nightly evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-evidence-language-wasm-${{ github.sha }}
          path: target/ci/evidence/*.evidence.json
          if-no-files-found: error
          retention-days: 14

  stress:
    name: stress-${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gc
            task: nightly-stress-gc
            targets: gc-vm,gc-jit
            tags: gc
            repeat: 20
          - name: jit-osr
            task: nightly-stress-jit-osr
            targets: jit,osr
            tags: jit
            repeat: 5
          - name: gc-osr
            task: nightly-stress-gc-osr
            targets: vm,gc-vm,gc-osr
            tags: jit,osr,contract
            repeat: 5
          - name: scheduler
            task: nightly-stress-scheduler
            targets: vm,jit
            tags: scheduler
            repeat: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Start evidence clock
        shell: bash
        run: echo "VO_CI_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup engineering toolchain
        uses: ./.github/actions/setup-volang

      - name: Download immutable Nightly plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-plan-${{ github.sha }}
          path: target/ci/plan-input

      - name: Build repository tooling
        run: cargo build --locked -p vo-dev

      - name: Run stress selection
        run: |
          mkdir -p target/ci/results
          ./target/debug/vo-dev test run \
            --suite lang \
            --targets "${{ matrix.targets }}" \
            --tags "${{ matrix.tags }}" \
            --repeat "${{ matrix.repeat }}" \
            --release \
            --format json > "target/ci/results/${{ matrix.task }}.json"

      - name: Record Nightly evidence
        run: >-
          ./target/debug/vo-dev ci record
          --plan target/ci/plan-input/plan.json
          --task "${{ matrix.task }}"
          --output "target/ci/evidence/${{ matrix.task }}.evidence.json"

      - name: Upload Nightly evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-evidence-${{ matrix.task }}-${{ github.sha }}
          path: target/ci/evidence/*.evidence.json
          if-no-files-found: error
          retention-days: 14

  platform:
    name: platform-${{ matrix.os }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            task: nightly-platform-macos
          - os: windows-2025
            task: nightly-platform-windows
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Start evidence clock
        shell: bash
        run: echo "VO_CI_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup engineering toolchain
        uses: ./.github/actions/setup-volang

      - name: Download immutable Nightly plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-plan-${{ github.sha }}
          path: target/ci/plan-input

      - name: Build repository tooling
        run: cargo build --locked -p vo-dev

      - name: Run native language smoke matrix
        run: |
          mkdir -p target/ci/results
          ./target/debug/vo-dev test run \
            --suite lang \
            --tags smoke \
            --targets native,gc-vm,gc-osr \
            --release \
            --format json > "target/ci/results/${{ matrix.task }}.json"

      - name: Run workspace tests
        run: cargo test --workspace --all-targets --locked --no-fail-fast

      - name: Record Nightly evidence
        run: >-
          ./target/debug/vo-dev ci record
          --plan target/ci/plan-input/plan.json
          --task "${{ matrix.task }}"
          --output "target/ci/evidence/${{ matrix.task }}.evidence.json"

      - name: Upload Nightly evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-evidence-${{ matrix.task }}-${{ github.sha }}
          path: target/ci/evidence/*.evidence.json
          if-no-files-found: error
          retention-days: 14

  bounded_fuzz:
    name: bounded-fuzz (${{ matrix.target }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_FUZZ_VERSION: "0.13.2"
      RUST_NIGHTLY: "nightly-2026-08-20"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ui_artifact_decoders
            task: nightly-fuzz-ui-artifact
            fuzz_dir: fuzz/ui-artifact
            max_len: 65536
          - target: decoders
            task: nightly-fuzz-app-protocol
            fuzz_dir: fuzz/app-protocol
            max_len: 4096
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Start evidence clock
        shell: bash
        run: echo "VO_CI_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup engineering toolchain
        uses: ./.github/actions/setup-volang

      - name: Install fuzzing toolchain
        run: rustup toolchain install "$RUST_NIGHTLY" --profile minimal

      - name: Download immutable Nightly plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-plan-${{ github.sha }}
          path: target/ci/plan-input

      - name: Cache cargo-fuzz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_FUZZ_VERSION }}

      - name: Install cargo-fuzz
        run: |
          echo "$RUNNER_TOOL_CACHE/cargo-fuzz/bin" >> "$GITHUB_PATH"
          if [[ ! -x "$RUNNER_TOOL_CACHE/cargo-fuzz/bin/cargo-fuzz" ]]; then
            cargo +"$RUST_NIGHTLY" install \
              --root "$RUNNER_TOOL_CACHE/cargo-fuzz" \
              --version "$CARGO_FUZZ_VERSION" \
              cargo-fuzz \
              --locked
          fi

      - name: Build repository tooling
        run: cargo build --locked -p vo-dev

      - name: Build coverage-instrumented fuzz target
        working-directory: ${{ matrix.fuzz_dir }}
        run: |
          cargo +"$RUST_NIGHTLY" metadata --locked --format-version 1 > "$RUNNER_TEMP/${{ matrix.target }}-cargo-metadata.json"
          cargo +"$RUST_NIGHTLY" fuzz build --fuzz-dir . "${{ matrix.target }}"

      - name: Fuzz authenticated and untrusted protocol boundary
        working-directory: ${{ matrix.fuzz_dir }}
        run: |
          fuzz_output="$GITHUB_WORKSPACE/target/ci/fuzz/${{ matrix.task }}"
          mkdir -p "$fuzz_output/corpus" "$fuzz_output/artifacts"
          cargo +"$RUST_NIGHTLY" fuzz run --fuzz-dir . "${{ matrix.target }}" \
            "$fuzz_output/corpus" "corpus/${{ matrix.target }}" -- \
            -artifact_prefix="$fuzz_output/artifacts/" \
            -runs=100000 \
            -max_len=${{ matrix.max_len }} \
            -timeout=10 \
            -seed=424242

      - name: Record Nightly evidence
        run: >-
          ./target/debug/vo-dev ci record
          --plan target/ci/plan-input/plan.json
          --task "${{ matrix.task }}"
          --output "target/ci/evidence/${{ matrix.task }}.evidence.json"

      - name: Upload Nightly evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-evidence-${{ matrix.task }}-${{ github.sha }}
          path: target/ci/evidence/*.evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Preserve fuzzing failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}-${{ github.sha }}
          path: target/ci/fuzz/${{ matrix.task }}
          if-no-files-found: ignore
          retention-days: 14

  audits:
    name: audits
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Start evidence clock
        shell: bash
        run: echo "VO_CI_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup engineering toolchain
        uses: ./.github/actions/setup-volang

      - name: Download immutable Nightly plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-plan-${{ github.sha }}
          path: target/ci/plan-input

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Cache cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2

      - name: Install cargo-audit
        run: |
          if [ "$(cargo audit --version 2>/dev/null || true)" != "cargo-audit 0.22.2" ]; then
            cargo install cargo-audit --locked --version 0.22.2 --force
          fi

      - name: Build repository tooling
        run: cargo build --locked -p vo-dev

      - name: Audit every maintained dependency input
        run: node eng/run-dependency-audit.mjs

      - name: Record Nightly evidence
        run: >-
          ./target/debug/vo-dev ci record
          --plan target/ci/plan-input/plan.json
          --task nightly-audits
          --output target/ci/evidence/nightly-audits.evidence.json

      - name: Upload Nightly evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-evidence-audits-${{ github.sha }}
          path: target/ci/evidence/*.evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload dependency audit diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-${{ github.sha }}
          path: |
            target/ci/dependency-audit
            target/ci/results/dependencies.json
          if-no-files-found: ignore
          retention-days: 30

  required:
    name: nightly-required
    if: ${{ always() }}
    needs:
      - plan
      - language_release_native
      - language_release_wasm
      - stress
      - platform
      - bounded_fuzz
      - audits
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Reject incomplete jobs
        env:
          PLAN: ${{ needs.plan.result }}
          LANGUAGE_NATIVE: ${{ needs.language_release_native.result }}
          LANGUAGE_WASM: ${{ needs.language_release_wasm.result }}
          STRESS: ${{ needs.stress.result }}
          PLATFORM: ${{ needs.platform.result }}
          BOUNDED_FUZZ: ${{ needs.bounded_fuzz.result }}
          AUDITS: ${{ needs.audits.result }}
        run: |
          for result in "$PLAN" "$LANGUAGE_NATIVE" "$LANGUAGE_WASM" "$STRESS" "$PLATFORM" "$BOUNDED_FUZZ" "$AUDITS"; do
            if [ "$result" != "success" ]; then
              echo "Nightly job ended with: $result"
              exit 1
            fi
          done

      - name: Checkout certified source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup certification toolchain
        uses: ./.github/actions/setup-volang

      - name: Download immutable Nightly plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-plan-${{ github.sha }}
          path: target/ci/plan-input

      - name: Download all Nightly evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nightly-evidence-*-${{ github.sha }}
          path: target/ci/collected-evidence
          merge-multiple: true

      - name: Build certification verifier
        run: cargo build --locked -p vo-dev

      - name: Certify the complete Nightly plan
        run: >-
          ./target/debug/vo-dev ci certify
          --plan target/ci/plan-input/plan.json
          --evidence-dir target/ci/collected-evidence
          --output target/ci/nightly-certification.json

      - name: Upload Nightly certification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-certification-${{ github.sha }}
          path: target/ci/nightly-certification.json
          if-no-files-found: error
          retention-days: 30
