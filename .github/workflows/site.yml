name: Site

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  VOWORK: "off"

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Volang Studio
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_sha == github.sha) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout certified source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Install Rust and WebAssembly target
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.94.0
          rustup default 1.94.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: lang/crates/vo-web/package-lock.json

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: site-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Cache wasm-pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-0.14.0

      - name: Install wasm-pack
        run: |
          if [ "$(wasm-pack --version 2>/dev/null || true)" != "wasm-pack 0.14.0" ]; then
            cargo install wasm-pack --locked --version 0.14.0 --force
          fi

      - name: Build release Web runtime
        working-directory: lang/crates/vo-web
        run: |
          npm ci
          npm run build:release

      - name: Build Volang Studio AOT site
        run: |
          cargo build --locked -p vo --no-default-features
          VOWORK="$GITHUB_WORKSPACE/vo.work" ./target/debug/vo ui build apps/studio \
            -o target/volang-dev \
            --runtime-dir=lang/crates/vo-web
          test -s target/volang-dev/app.wasm
          test -s target/volang-dev/runtime/pkg/vo_web_bg.wasm
          test "$(cat target/volang-dev/CNAME)" = "volang.dev"

      - name: Enforce Studio image budget
        run: >-
          node eng/report-ui-web-artifact-size.mjs
          --label studio
          --artifact target/volang-dev/app.wasm
          --brotli-limit 983040
          --gzip-limit 2700000

      - name: Enforce Studio install budget
        run: >-
          node eng/report-ui-web-precache-size.mjs
          --label studio
          --root target/volang-dev
          --gzip-limit 3670016

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/volang-dev
          retention-days: 1

  deploy:
    name: Deploy volang.dev
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
