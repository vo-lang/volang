name: Site

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main CI run id whose certified site will be promoted.
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  VOWORK: "off"

concurrency:
  group: pages-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  promote:
    name: Promote certified Studio
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
      run_id: ${{ steps.candidate.outputs.run_id }}
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Resolve certified candidate
        id: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_RUN_ID: ${{ inputs.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            run_id="$WORKFLOW_RUN_ID"
          else
            run_id="$MANUAL_RUN_ID"
          fi
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          commit="$(jq -er '
            if .name == "CI" and
               .path == ".github/workflows/ci.yml" and
               .event == "push" and
               .head_branch == "main" and
               .status == "completed" and
               .conclusion == "success"
            then .head_sha
            else error("run is not a successful main push from .github/workflows/ci.yml")
            end
          ' <<<"$run")"
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$commit" != "$WORKFLOW_HEAD_SHA" ]; then
            echo "workflow_run payload and API commit disagree" >&2
            exit 1
          fi
          {
            echo "run_id=$run_id"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout certified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.commit }}
          persist-credentials: false

      - name: Setup verification toolchain
        uses: ./.github/actions/setup-volang

      - name: Download certified Studio site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-candidate-${{ steps.candidate.outputs.commit }}
          path: target/ci/artifacts/site
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download CI certification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-certification-${{ steps.candidate.outputs.commit }}
          path: target/ci/certification-input
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Build certification verifier
        run: cargo build --locked -p vo-dev

      - name: Verify exact candidate identity and bytes
        run: |
          ./target/debug/vo-dev ci verify \
            --bundle target/ci/certification-input/certification.json \
            --profile main \
            --artifact-task wasm-web-full \
            --artifact target/ci/artifacts/site
          test -s target/ci/artifacts/site/app.wasm
          test -s target/ci/artifacts/site/runtime/pkg/vo_web_bg.wasm
          test "$(cat target/ci/artifacts/site/CNAME)" = "volang.dev"

      - name: Recheck deployment budgets
        run: |
          node eng/report-ui-web-artifact-size.mjs \
            --label studio \
            --artifact target/ci/artifacts/site/app.wasm \
            --raw-limit 34000000 \
            --brotli-limit 972800 \
            --gzip-limit 2500000
          node eng/report-ui-web-precache-size.mjs \
            --label studio \
            --root target/ci/artifacts/site \
            --gzip-limit 3670016

      - name: Setup browser contracts
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: eng/browser/package-lock.json

      - name: Install pinned browser
        run: |
          npm ci --ignore-scripts --prefix eng/browser
          cd eng/browser
          PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/target/playwright-browsers" npx playwright install --with-deps chromium

      - name: Exercise the final certified site before deployment
        run: |
          node eng/run-browser-smoke.mjs \
            --static-root target/ci/artifacts/site \
            --studio-aot-smoke --timeout-ms 120000 \
            --output target/ci/results/site-predeploy.json
          ./target/debug/vo-dev ci verify \
            --bundle target/ci/certification-input/certification.json \
            --profile main --artifact-task wasm-web-full \
            --artifact target/ci/artifacts/site

      - name: Upload predeployment browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-predeploy-${{ steps.candidate.outputs.commit }}
          path: |
            target/ci/browser
            target/ci/results/site-predeploy.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/ci/artifacts/site
          retention-days: 1

  deploy:
    name: Deploy volang.dev
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Admit the current main candidate
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ needs.promote.outputs.commit }}
        run: |
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current" = "$CANDIDATE_COMMIT" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Candidate was superseded on main; deployment skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy certified Pages artifact
        if: steps.current.outputs.eligible == 'true'

        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  smoke:
    name: Verify deployed site
    needs: [promote, deploy]
    if: needs.deploy.outputs.page_url != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout certified browser contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.promote.outputs.commit }}
          persist-credentials: false

      - name: Download the same certified site bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-candidate-${{ needs.promote.outputs.commit }}
          path: target/ci/artifacts/site
          repository: ${{ github.repository }}
          run-id: ${{ needs.promote.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Setup browser contracts
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: eng/browser/package-lock.json

      - name: Install pinned browser
        run: |
          npm ci --ignore-scripts --prefix eng/browser
          cd eng/browser
          PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/target/playwright-browsers" npx playwright install --with-deps chromium

      - name: Verify deployed bytes and run the user journey
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          node eng/run-browser-smoke.mjs \
            --base-url "$PAGE_URL" \
            --expected-artifact target/ci/artifacts/site \
            --studio-canary-smoke --timeout-ms 120000 \
            --output target/ci/results/site-canary.json

      - name: Upload deployed journey diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-canary-${{ needs.promote.outputs.commit }}
          path: |
            target/ci/browser
            target/ci/results/site-canary.json
          if-no-files-found: warn
          retention-days: 14
