  required:
    name: required
    if: ${{ always() }}
    needs:
      - quality_rust
      - language_native
      - ui_platform
      - wasm_web
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every CI job
        env:
          QUALITY_RUST: ${{ needs.quality_rust.result }}
          LANGUAGE_NATIVE: ${{ needs.language_native.result }}
          UI_PLATFORM: ${{ needs.ui_platform.result }}
          WASM_WEB: ${{ needs.wasm_web.result }}
        run: |
          for result in "$QUALITY_RUST" "$LANGUAGE_NATIVE" "$UI_PLATFORM" "$WASM_WEB"; do
            if [ "$result" != "success" ]; then
              echo "required CI job ended with: $result"
              exit 1
            fi
          done
          echo "all required CI jobs passed"
