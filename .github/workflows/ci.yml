name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  VOWORK: "off"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      rust_quality: ${{ steps.plan.outputs.rust_quality }}
      language_matrix: ${{ steps.plan.outputs.language_matrix }}
      wasm_task: ${{ steps.plan.outputs.wasm_task }}
      ui_matrix: ${{ steps.plan.outputs.ui_matrix }}
      site_candidate: ${{ steps.plan.outputs.site_candidate }}
    steps:
      - name: Checkout complete candidate history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup engineering toolchain
        uses: ./.github/actions/setup-volang
        with:
          compiler-cache: "true"

      - name: Build CI planner
        run: cargo build --locked -p vo-dev

      - name: Build immutable CI plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              profile=pull-request
              ./target/debug/vo-dev ci plan \
                --profile "$profile" \
                --base "$BASE_SHA" \
                --head "$HEAD_SHA" \
                --output target/ci/plan.json >/dev/null
              ;;
            merge_group)
              profile=merge
              ./target/debug/vo-dev ci plan \
                --profile "$profile" \
                --output target/ci/plan.json >/dev/null
              ;;
            push)
              profile=main
              ./target/debug/vo-dev ci plan \
                --profile "$profile" \
                --output target/ci/plan.json >/dev/null
              ;;
            workflow_dispatch)
              if [ "$GITHUB_REF" = "refs/heads/main" ]; then
                profile=main
              else
                profile=merge
              fi
              ./target/debug/vo-dev ci plan \
                --profile "$profile" \
                --output target/ci/plan.json >/dev/null
              ;;
            *)
              echo "unsupported CI event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          has_task() {
            jq --exit-status --arg task "$1" \
              'any(.tasks[]; .id == $task)' target/ci/plan.json >/dev/null
          }
          language_matrix="$(jq -c '
            [.tasks[]
              | select(.workflow_job == "language_native")
              | {
                  task: .id,
                  shard: (
                    if .id == "language-native-smoke" then "smoke"
                    elif .id == "language-native-1" then "1/2"
                    elif .id == "language-native-2" then "2/2"
                    else error("unknown language task")
                    end
                  )
                }
            ]' target/ci/plan.json)"
          ui_matrix="$(jq -c '
            [.tasks[]
              | select(.workflow_job == "ui_platform")
              | {
                  task: .id,
                  os: .runner,
                  full: (.id | endswith("-full"))
                }
            ]' target/ci/plan.json)"
          wasm_task="$(jq -r '
            [.tasks[] | select(.workflow_job == "wasm_web") | .id]
            | .[0] // ""
          ' target/ci/plan.json)"
          {
            echo "profile=$profile"
            echo "language_matrix=$language_matrix"
            echo "ui_matrix=$ui_matrix"
            echo "wasm_task=$wasm_task"
            if has_task rust-quality; then echo "rust_quality=true"; else echo "rust_quality=false"; fi
            if has_task wasm-web-full; then echo "site_candidate=true"; else echo "site_candidate=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable CI plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-plan-${{ github.sha }}
          path: target/ci/plan.json
          if-no-files-found: error
          retention-days: 14

  quality_rust:
    name: quality-rust
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Start evidence clock
        shell: bash
        run: echo "VO_CI_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup engineering toolchain
        uses: ./.github/actions/setup-volang
        with:
          components: rustfmt,clippy

      - name: Setup contract test Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Download immutable CI plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-plan-${{ github.sha }}
          path: target/ci/plan-input

      - name: Build repository tooling
        run: cargo build -p vo-dev --locked

      - name: Install workflow validator
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          install_dir="$RUNNER_TEMP/actionlint"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" actionlint
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Run repository contracts
        run: ./target/debug/vo-dev ci run --plan target/ci/plan-input/plan.json --task contracts

      - name: Run Rust quality checks
        if: needs.plan.outputs.rust_quality == 'true'
        run: ./target/debug/vo-dev ci run --plan target/ci/plan-input/plan.json --task rust-quality

      - name: Preserve task execution diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-executions-quality-${{ github.sha }}
          path: |
            target/ci/executions
            target/cargo-timings
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload quality evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-quality-${{ github.sha }}
          path: target/ci/evidence/*.evidence.json
          if-no-files-found: error
          retention-days: 14

  language_native:
    if: needs.plan.outputs.language_matrix != '[]'
    name: language-native (${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.language_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Start evidence clock
        shell: bash
        run: echo "VO_CI_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup engineering toolchain
        uses: ./.github/actions/setup-volang

      - name: Download immutable CI plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-plan-${{ github.sha }}
          path: target/ci/plan-input

      - name: Build repository tooling
        run: cargo build -p vo-dev --locked

      - name: Execute declared language task
        run: >-
          ./target/debug/vo-dev ci run
          --plan target/ci/plan-input/plan.json
          --task "${{ matrix.task }}"

      - name: Upload task evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-${{ matrix.task }}-${{ github.sha }}
          path: target/ci/evidence/*.evidence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload task diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-diagnostics-${{ matrix.task }}-${{ github.sha }}
          path: |
            target/ci/executions
            target/ci/test-runs
            target/cargo-timings
          if-no-files-found: warn
          retention-days: 14

  wasm_web:
    name: wasm-web
    needs: plan
    if: needs.plan.outputs.wasm_task != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup engineering toolchain
        uses: ./.github/actions/setup-volang
        with:
          wasm: "true"

      - name: Download immutable CI plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-plan-${{ github.sha }}
          path: target/ci/plan-input

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            lang/crates/vo-web/package-lock.json
            eng/browser/package-lock.json

      - name: Setup browser contracts
        uses: ./.github/actions/setup-browser

      - name: Cache wasm-pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-0.14.0

      - name: Install wasm-pack
        run: |
          if [ "$(wasm-pack --version 2>/dev/null || true)" != "wasm-pack 0.14.0" ]; then
            cargo install wasm-pack --locked --version 0.14.0 --force
          fi

      - name: Build repository tooling
        run: cargo build -p vo-dev --locked

      - name: Execute declared Web task
        env:
          WASM_TASK: ${{ needs.plan.outputs.wasm_task }}
        run: >-
          ./target/debug/vo-dev ci run
          --plan target/ci/plan-input/plan.json
          --task "$WASM_TASK"

      - name: Upload task evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-wasm-web-${{ github.sha }}
          path: target/ci/evidence/*.evidence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload task diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-diagnostics-wasm-web-${{ github.sha }}
          path: |
            target/ci/executions
            target/ci/results
            target/cargo-timings
          if-no-files-found: warn
          retention-days: 14

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics-${{ github.sha }}
          path: target/ci/browser
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload promotable Studio site
        if: needs.plan.outputs.site_candidate == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-candidate-${{ github.sha }}
          path: target/ci/artifacts/site
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  ui_platform:
    if: needs.plan.outputs.ui_matrix != '[]'
    name: ui-platform (${{ matrix.os }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.ui_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup engineering toolchain
        uses: ./.github/actions/setup-volang

      - name: Download immutable CI plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-plan-${{ github.sha }}
          path: target/ci/plan-input

      - name: Build evidence tooling
        run: cargo build --locked -p vo-dev

      - name: Install Linux window smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxkbcommon-x11-0 mesa-vulkan-drivers xvfb

      - name: Execute declared native UI task
        env:
          UI_TASK: ${{ matrix.task }}
        run: >-
          ./target/debug/vo-dev ci run
          --plan target/ci/plan-input/plan.json
          --task "$UI_TASK"

      - name: Upload native UI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-${{ matrix.task }}-${{ github.sha }}
          path: target/ci/evidence/*.evidence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload native UI diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-diagnostics-${{ matrix.task }}-${{ github.sha }}
          path: |
            target/ci/executions
            target/ci/results
            target/cargo-timings
          if-no-files-found: warn
          retention-days: 14

  required:
    name: required
    if: ${{ always() }}
    needs:
      - plan
      - quality_rust
      - language_native
      - ui_platform
      - wasm_web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Reject failed or cancelled jobs
        env:
          PLAN: ${{ needs.plan.result }}
          QUALITY_RUST: ${{ needs.quality_rust.result }}
          LANGUAGE_NATIVE: ${{ needs.language_native.result }}
          UI_PLATFORM: ${{ needs.ui_platform.result }}
          WASM_WEB: ${{ needs.wasm_web.result }}
        run: |
          for result in "$PLAN" "$QUALITY_RUST" "$LANGUAGE_NATIVE" "$UI_PLATFORM" "$WASM_WEB"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "CI job ended with: $result"
              exit 1
            fi
          done

      - name: Checkout certified source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup certification toolchain
        uses: ./.github/actions/setup-volang

      - name: Download immutable CI plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-plan-${{ github.sha }}
          path: target/ci/plan-input

      - name: Download all task evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-evidence-*-${{ github.sha }}
          path: target/ci/collected-evidence
          merge-multiple: true

      - name: Build certification verifier
        run: cargo build --locked -p vo-dev

      - name: Certify the complete planned task set
        run: |
          ./target/debug/vo-dev ci certify \
            --plan target/ci/plan-input/plan.json \
            --evidence-dir target/ci/collected-evidence \
            --output target/ci/certification.json

      - name: Require complete UI evidence for merge and promotion
        if: needs.plan.outputs.profile != 'pull-request'
        run: ./target/debug/vo-dev ui-certify --evidence target/ci/certification.json

      - name: Upload certification bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-certification-${{ github.sha }}
          path: target/ci/certification.json
          if-no-files-found: error
          retention-days: 30
