[package]
name = "studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.0"
license = "MIT"
description = "Native desktop host for Vo Studio"
repository = "https://github.com/vo-lang/volang"
homepage = "https://volang.dev"
publish = false

[lib]
name = "studio_lib"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
dirs = "5"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
ureq = "2"
url = "2"
rfd = "0.15"
vo-common = { path = "../../../lang/crates/vo-common" }
vo-app-runtime = { path = "../../../lang/crates/vo-app-runtime", features = ["std"] }
vo-app-host-native = { path = "../../../lang/crates/vo-app-host-native", features = ["provider-loading"] }
vo-engine = { path = "../../../lang/crates/vo-engine" }
vo-module = { path = "../../../lang/crates/vo-module" }
vo-runtime = { path = "../../../lang/crates/vo-runtime" }
vo-web = { path = "../../../lang/crates/vo-web" }
vogui-protocol = { git = "https://github.com/vo-lang/vogui", rev = "a5bf43f92f02667dcd339dee8975eb45e1ccf21e" }

[patch."https://github.com/vo-lang/volang"]
vo-common    = { path = "../../../lang/crates/vo-common" }
vo-engine    = { path = "../../../lang/crates/vo-engine" }
vo-ffi-macro = { path = "../../../lang/crates/vo-ffi-macro" }
vo-module    = { path = "../../../lang/crates/vo-module" }
vo-runtime   = { path = "../../../lang/crates/vo-runtime" }
vo-syntax    = { path = "../../../lang/crates/vo-syntax" }
vo-vm        = { path = "../../../lang/crates/vo-vm" }
