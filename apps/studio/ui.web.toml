routes = [
  "/",
  "/runner",
  "/docs/introduction",
  "/docs/installation",
  "/docs/hello-world",
  "/docs/language-tour",
  "/docs/vo-for-gophers",
  "/docs/error-handling",
  "/docs/dynamic-access",
  "/docs/concurrency",
  "/docs/modules",
  "/docs/standard-library",
  "/docs/cli",
  "/docs/execution-backends",
  "/docs/embedding-rust",
  "/docs/language-specification",
  "/docs/module-specification",
  "/docs/channel-specification",
  "/docs/dynamic-specification",
  "/docs/native-ffi-specification",
