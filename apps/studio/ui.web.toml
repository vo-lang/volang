[document]
language = "en"
direction = "ltr"
title = "Volang Studio"
description = "A pure Volang workbench for authoring, running, and publishing Volang applications."
theme_color = "#070a10"

[host]
module = "/studio-host.js"
export = "createStudioHost"
compiler = true

[pwa]
enabled = true
name = "Volang Studio"
short_name = "Vo Studio"
start_url = "/"
scope = "/"
display = "standalone"
offline_url = "/offline"
cache_version = "volang-studio-v1"

[security]
content_security_policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com https://github.com https://objects.githubusercontent.com; object-src 'none'; base-uri 'self'"
permissions_policy = "camera=(), microphone=(), geolocation=()"
cross_origin_opener_policy = "same-origin"
require_https = true
