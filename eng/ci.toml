[[command]]
id = "contract-lint"
argv = ["target/debug/vo-dev", "lint", "all"]
timeout_seconds = 600
failure_kind = "infrastructure"

[[command]]
id = "ui-catalog"
argv = ["target/debug/vo-dev", "ui-certify", "--check"]
timeout_seconds = 120
failure_kind = "product"

[[command]]
id = "language-manifest"
argv = ["target/debug/vo-dev", "test", "lint", "--suite", "lang", "--strict"]
timeout_seconds = 120
failure_kind = "product"

[[command]]
id = "language-format"
argv = ["target/debug/vo-dev", "test", "fmt", "--suite", "lang"]
timeout_seconds = 120
failure_kind = "product"

[[command]]
id = "dependency-policy-unit"
argv = ["node", "--test", "eng/check-dependency-policy.test.mjs"]
timeout_seconds = 120
failure_kind = "dependency-policy"

[[command]]
id = "workflow-lint"
argv = ["bash", "-euo", "pipefail", "-c", "command -v shellcheck >/dev/null || { echo 'workflow checks require ShellCheck; see eng/toolchains.toml' >&2; exit 1; }; actionlint -ignore 'unexpected key \"queue\"'"]
timeout_seconds = 120
failure_kind = "infrastructure"

[[command]]
id = "rust-format"
argv = ["cargo", "fmt", "--all", "--", "--check"]
timeout_seconds = 120
failure_kind = "product"

[[command]]
id = "rust-clippy"
argv = ["cargo", "clippy", "--workspace", "--all-targets", "--locked", "--timings", "--", "-D", "warnings"]
timeout_seconds = 1500
failure_kind = "product"

[[command]]
id = "rust-tests"
argv = ["cargo", "test", "--workspace", "--all-targets", "--locked", "--no-fail-fast", "--timings"]
timeout_seconds = 1500
failure_kind = "product"
report = "cargo-test"

[[command]]
id = "dependency-audit"
argv = ["node", "eng/run-dependency-audit.mjs"]
timeout_seconds = 1500
failure_kind = "dependency-policy"

