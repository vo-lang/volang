version = 1

# Non-Cargo inputs and product dependencies. Rust package edges are read from
# workspace manifests, including optional and target-specific dependencies.
[[component]]
id = "language-library"
paths = ["lang/stdlib/*"]
capabilities = ["rust", "vm", "jit", "gc", "compile", "embed", "native-aot", "wasm-vm"]

[[component]]
id = "language-tests"
paths = ["tests/lang/*", "examples/*", "benchmarks/*"]
depends_on = ["language-library", "cargo:cmd/vo", "cargo:cmd/vo-test", "cargo:cmd/vo-embed"]
capabilities = ["vm", "jit", "gc", "compile", "embed", "native-aot", "wasm-vm"]

[[component]]
id = "ui-library"
paths = ["ui/*", "tests/ui/*"]
depends_on = ["language-library"]
capabilities = ["rust", "browser", "headless", "desktop-vm", "desktop-jit", "desktop-native-aot"]

[[component]]
id = "native-ui-products"
paths = []
depends_on = ["ui-library", "cargo:cmd/vo", "cargo:lang/crates/vo-ui-native", "cargo:lang/crates/vo-ui-webview", "cargo:lang/crates/vo-ui-desktop-runtime"]
capabilities = ["headless", "desktop-vm", "desktop-jit", "desktop-native-aot", "real-window"]

[[component]]
id = "web-runtime"
paths = ["lang/crates/vo-web/js/*", "lang/crates/vo-web/tests/*", "lang/crates/vo-web/*.mjs", "lang/crates/vo-web/*.json", "lang/crates/vo-web/*.html"]
depends_on = ["cargo:lang/crates/vo-web", "ui-library"]
capabilities = ["browser", "wasm-vm"]

[[component]]
id = "studio"
paths = ["apps/studio/*"]
depends_on = ["ui-library", "web-runtime", "native-ui-products"]
capabilities = ["rust", "browser", "studio", "pages", "offline", "headless", "desktop-vm", "desktop-jit", "desktop-native-aot"]

[[component]]
id = "app-protocol"
paths = ["lang/protocol/*", "fuzz/app-protocol/*"]
depends_on = ["cargo:lang/crates/vo-app-protocol"]
capabilities = ["rust", "vm", "jit", "wasm-vm", "browser", "headless", "desktop-vm", "desktop-jit", "desktop-native-aot", "app-protocol", "desktop-delivery"]

[[component]]
id = "ecosystem"
paths = ["fuzz/voplay-protocol/*"]
depends_on = ["app-protocol"]
capabilities = ["rust", "vm", "jit", "browser", "app-protocol"]

# Packaging/loader changes retain complete desktop acceptance on pull requests.
# Core runtime and UI changes use the cross-platform feedback lanes first.
[[component]]
id = "desktop-delivery"
paths = ["cmd/vo/src/main.rs", "lang/crates/vo-ui-desktop-runtime/*", "lang/crates/vo-ui-webview/*", "lang/crates/vo-ui-native/*"]
capabilities = ["desktop-delivery"]

# Profiles describe certification depth. Pull requests use impact selection;
# merge queues and immutable branch candidates exercise the complete matrix.

[[profile]]
name = "pull-request"
tier = "feedback"
changed_only = true
tasks = [
  "contracts",
  "rust-quality",
  "language-native-smoke",
  "wasm-web-smoke",
  "ui-web-rewrite",
  "ui-platform-linux-smoke",
  "ui-platform-macos-smoke",
  "ui-platform-windows-smoke",
  "ui-desktop-rewrite-linux",
  "ui-desktop-rewrite-macos",
  "ui-desktop-rewrite-windows",
]

[[profile]]
name = "merge"
tier = "certification"
tasks = [
  "contracts",
  "rust-quality",
  "language-native-1",
  "language-native-2",
  "wasm-web-full",
  "ui-web-rewrite",
  "ui-desktop-rewrite-linux",
  "ui-desktop-rewrite-macos",
  "ui-desktop-rewrite-windows",
]

[[profile]]
name = "main"
tier = "promotion"
tasks = [
  "contracts",
  "rust-quality",
  "language-native-1",
  "language-native-2",
  "wasm-web-full",
  "ui-web-rewrite",
  "ui-desktop-rewrite-linux",
  "ui-desktop-rewrite-macos",
  "ui-desktop-rewrite-windows",
]

[[profile]]
name = "nightly"
tier = "exhaustive"
tasks = [
  "nightly-language-native",
  "nightly-language-wasm",
  "nightly-stress-gc",
  "nightly-stress-jit-osr",
  "nightly-stress-gc-osr",
  "nightly-stress-scheduler",
  "nightly-platform-macos",
  "nightly-platform-windows",
  "nightly-fuzz-app-protocol",
  "nightly-audits",
  "nightly-browser",
]

